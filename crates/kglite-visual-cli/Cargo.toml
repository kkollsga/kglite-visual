[package]
name = "kglite-visual-cli"
version.workspace = true
rust-version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Localhost viewer for .kgl knowledge graphs: one binary, no install step."

[[bin]]
name = "kglite-visual"
path = "src/main.rs"

[dependencies]
# VERSION SITE 2 of 4. `[workspace.package] version` does not reach this
# requirement string, and `cargo publish` demands it — the exact omission that
# broke a KGLite release. See CLAUDE.md → "Commits & releases".
kglite-visual-core = { version = "0.1.0", path = "../kglite-visual-core" }

clap = { version = "4.6.6", features = ["derive"] }
axum = { version = "0.8", features = ["ws"] }
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "net"] }
rust-embed = { version = "8", features = ["debug-embed", "interpolate-folder-path"] }
mime_guess = "2.0.5"
webbrowser = "1.2.4"
serde.workspace = true
serde_json.workspace = true
futures-util = "0.3.34"

[dev-dependencies]
# The render subcommand's tests drive the real binary and need somewhere to
# write to that is not the repo.
tempfile = "3.27.0"
