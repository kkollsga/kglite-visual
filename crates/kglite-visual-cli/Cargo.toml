[package]
name = "kglite-visual-cli"
version.workspace = true
rust-version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Localhost viewer for .kgl knowledge graphs: one binary, no install step."

[[bin]]
name = "kglite-visual"
path = "src/main.rs"

[dependencies]
# VERSION SITE 2 of 3. `[workspace.package] version` does not reach this
# requirement string, and `cargo publish` demands it — the exact omission that
# broke a KGLite release. See CLAUDE.md → "Commits & releases".
kglite-visual-core = { version = "0.1.0", path = "../kglite-visual-core" }

clap = { version = "4.6.6", features = ["derive"] }
