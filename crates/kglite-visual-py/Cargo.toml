[package]
name = "kglite-visual-py"
version.workspace = true
rust-version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "PyO3 wrapper for kglite-visual. Built by maturin into the kglite-visual wheel."
# The wheel is the artifact Python users want; a crates.io copy of the wrapper
# would be redundant. Rust embedders depend on kglite-visual-core directly.
publish = false

[lib]
# Distinct from the core crate's rlib filename, and from the cdylib the wheel
# ships (renamed by pyproject.toml's `module-name`).
name = "kglite_visual_py"
crate-type = ["cdylib", "rlib"]

[features]
default = ["abi3"]
# Maturin turns this on so the wheel build gets `extension-module`; a plain
# `cargo build`/`cargo test` leaves it off so the crate still links against a
# real libpython instead of failing at link time.
python-extension = ["pyo3/extension-module"]
# One cdylib for every Python from 3.10 up.
abi3 = ["pyo3/abi3-py310"]

[dependencies]
# 0.29 matches KGLite's wheel. Two extension modules that link different pyo3
# majors can coexist, but keeping them in step is free and removes a variable
# from any notebook that imports both.
#
# The floor is 0.29.0 and it is REAL, not a caret written by habit. KGLite's
# release-time ecosystem audit flagged the gap between this declaration and the
# 0.29.2 the lockfile resolves, so it was measured rather than argued:
# `cargo update -p pyo3 --precise 0.29.0`, rebuild the extension into the venv,
# run the wheel's whole suite — 38 passed, 2026-08-29. Not "it compiles", which
# is the weak test this project has a rule about: the suite drives `show()`,
# the launch contract and the `to_bytes()` handover through a real interpreter.
# The lockfile is back at 0.29.2, which is what ships.
pyo3 = { version = "0.29" }

# VERSION SITE 3 of 4. See CLAUDE.md → "Commits & releases".
kglite-visual-core = { version = "0.1.5", path = "../kglite-visual-core" }

# VERSION SITE 4 of 4. The wheel links the CLI's library half rather than
# re-implementing the axum server (plan D9, lib-link): one server, one embedded
# bundle, one launch contract. The binary stays the only binary — this
# dependency reaches the `[lib]`, and the console script goes through
# `run_from`, the same entry `main.rs` calls.
kglite-visual-cli = { version = "0.1.5", path = "../kglite-visual-cli" }

# The wheel owns the runtime the server thread runs on: `show()` returns while
# the server keeps serving, so the runtime is built inside the thread rather
# than by whatever called us. `sync` is for the one-shot shutdown channel that
# `close()` fires.
tokio = { version = "1.53.1", features = ["rt-multi-thread", "sync"] }

# NO `[global_allocator]`, and no allocator dependency — deliberately (plan
# D9). KGLite's wheel installs mimalloc; a second extension module doing the
# same in one interpreter is the two-allocator SIGSEGV shape KGLite already
# pays a canary for, and importing both wheels in one notebook is the expected
# case, not the exotic one. `make check-no-global-allocator` enforces the
# absence, because the failure mode is a crash in someone else's process and
# a code review is not a gate.
