[package]
name = "kglite-visual-core"
version.workspace = true
rust-version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Engine-facing core for kglite-visual: graph loading, session state, and the transport-agnostic wire protocol."

[dependencies]
# The engine, from crates.io. `=0.16.19` is EXACT on purpose (D11): kglite is
# pre-1.0 and ships documented breaking changes in patch releases, so a caret
# range would let a routine `cargo update` swap the engine under us. Moving
# this floor means reading kglite's CHANGELOG and re-greping every declaration
# of the old number (CLAUDE.md → "Commits & releases", R16). This is the
# primary declaration of the kglite floor.
#
# crates.io status, checked 2026-08-29 against the registry API (not the
# README): kglite IS published — 99 versions, newest and default `0.16.13`,
# crate not yanked. Re-checked later the same day after KGLite shipped the
# fixes this project's findings drove: `0.16.14` is published and current.
# Re-checked 2026-08-30: `0.16.15` is published and current — the release
# carrying `row_limit`, `LoadOptions` and the spill-race fix. Re-checked
# 2026-08-31: `0.16.16` is published and current — the release cut from this
# project's six findings, whose headline is a deadline now polled inside the
# MATCH row-build loops (not only the pattern matcher) under a 15-shape
# cancellation contract, and whose one breaking removal is
# `QueryDiagnostics::timed_out`. Re-checked the same day: `0.16.17` is
# published and current, and the floor went straight there — it pulls `geo`
# with `default-features = false`, dropping five transitive packages. That is
# safe here because nothing in this workspace names `geo` or `geojson` in any
# manifest (verified 2026-08-31, four manifests, zero hits): a consumer that
# relied on kglite to switch on geo's default features for its OWN direct geo
# dependency would have to declare them itself, and we have no such dependency.
# Re-checked 2026-08-31 (evening): `0.16.18` is published and current — its
# entire surface is the MCP server binary (CSV port binding, lenient
# source-root resolution, selftest reporting); nothing in the engine crate,
# the `.kgl` format, or the Cypher dialect moved. Re-checked 2026-09-01:
# `0.16.19` is published and current — the writer-lifecycle release (lazy
# writer lease, identity-based auto-refresh in kglite's MCP server, atomic
# generation publish for disk directories). Every engine change is on the
# WRITE side; `load_file_with` / `load_kgl_bytes_with`, the two functions this
# read-only viewer loads through, are byte-identical to 0.16.18 and take no
# lease, so a viewer serving a `.kgl` that a 0.16.19 writer is also serving
# needs nothing from this crate to coexist with it.
#
# NO `path` component, and its removal (P6) fixed a shipped defect rather than
# tidying a preference. The sibling checkout sits OUTSIDE this workspace, and
# maturin vendors an out-of-workspace path dependency into the source
# distribution: the pre-P6 `maturin sdist` was 2.5 MB carrying 391 files of
# KGLite's source under this project's name, resolving against the vendored
# copy instead of the registry — the same failure KGLite's own build_wheels.yml
# records for sonagram. A path dep also cannot exist in CI or in any consumer's
# unpack directory, where `../../../KGLite` is simply absent.
#
# To develop against an unreleased kglite, patch it in locally and do not
# commit the result: an untracked `.cargo/config.toml` holding
# `[patch.crates-io] kglite = { path = "../../KGLite/crates/kglite" }` (paths
# there are relative to the config file, not to this manifest). That rewrites
# Cargo.lock's kglite entry to a sourceless path entry, so the committed
# lockfile must be restored before committing — which is exactly why the patch
# is opt-in and out of tree.
kglite = "=0.16.19"

# The rasteriser behind `RenderFormat::Png` (D13). Pure Rust, MIT/Apache-2.0,
# MSRV 1.85 — below this workspace's 1.88. `tiny-skia` is NOT a second manifest
# entry: resvg re-exports the exact copy it renders through, and two independent
# requirements on one rasteriser is a place `cargo update` can leave two of it.
#
# Default features minus the two this emitter cannot use: `svgz` (nothing here
# gzips its own output) and `raster-images` (the SVG is self-contained by rule —
# no `<image href>`, so no GIF/JPEG/WebP decoders need shipping). `text` and
# `system-fonts` stay, and they are the whole point: without them `<text>` is
# dropped silently. Measured cost, release binary on 2026-08-29:
# 11 739 152 -> 14 105 184 bytes (+2.26 MiB), same tree, same profile,
# with the PNG path the only difference.
resvg = { version = "0.48.1", default-features = false, features = ["text", "system-fonts", "memmap-fonts"] }

# Inflates the three vendored coastline outlines (G4b). The finest is 3.1 MB of
# JSON and 774 KB of gzip, and it is embedded in every binary and every wheel
# whether a map is drawn or not, so it ships compressed.
#
# NOT a new crate in the tree: kglite already depends on flate2 for `.kgl`
# compression, so this is a direct requirement on something Cargo.lock already
# resolves — no new licence, no new build time, and no second copy (the version
# requirement is deliberately loose so it unifies with the engine's rather than
# pinning a second one beside it).
flate2 = "1"

serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
ts-rs = { workspace = true }

[dev-dependencies]
tempfile = "3.27.0"
# The PNG smoke test decodes what resvg encoded, with a decoder that is not
# resvg's: an encoder checked only by its own decoder can agree with itself
# about a file nothing else opens.
png = "0.18.1"
