[package]
name = "kglite-visual-core"
version.workspace = true
rust-version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Engine-facing core for kglite-visual: graph loading, session state, and the transport-agnostic wire protocol."

[dependencies]
# The engine, from crates.io. `=0.16.22` is EXACT on purpose (D11): kglite is
# pre-1.0 and ships documented breaking changes in patch releases, so a caret
# range would let a routine `cargo update` swap the engine under us. Moving
# this floor means reading kglite's CHANGELOG and re-greping every declaration
# of the old number (CLAUDE.md → "Commits & releases", R16). This is the
# primary declaration of the kglite floor.
#
# crates.io status, checked 2026-08-29 against the registry API (not the
# README): kglite IS published — 99 versions, newest and default `0.16.13`,
# crate not yanked. Re-checked later the same day after KGLite shipped the
# fixes this project's findings drove: `0.16.14` is published and current.
# Re-checked 2026-08-30: `0.16.15` is published and current — the release
# carrying `row_limit`, `LoadOptions` and the spill-race fix. Re-checked
# 2026-08-31: `0.16.16` is published and current — the release cut from this
# project's six findings, whose headline is a deadline now polled inside the
# MATCH row-build loops (not only the pattern matcher) under a 15-shape
# cancellation contract, and whose one breaking removal is
# `QueryDiagnostics::timed_out`. Re-checked the same day: `0.16.17` is
# published and current, and the floor went straight there — it pulls `geo`
# with `default-features = false`, dropping five transitive packages. That is
# safe here because nothing in this workspace names `geo` or `geojson` in any
# manifest (verified 2026-08-31, four manifests, zero hits): a consumer that
# relied on kglite to switch on geo's default features for its OWN direct geo
# dependency would have to declare them itself, and we have no such dependency.
# Re-checked 2026-08-31 (evening): `0.16.18` is published and current — its
# entire surface is the MCP server binary (CSV port binding, lenient
# source-root resolution, selftest reporting); nothing in the engine crate,
# the `.kgl` format, or the Cypher dialect moved. Re-checked 2026-09-02:
# `0.16.20` is published and current, and the floor went there from `0.16.19`
# in one step. Both releases are writer-side and MCP-side: 0.16.19 brought the
# lazy writer lease and identity-based auto-refresh in kglite's own MCP
# server, 0.16.20 the `released=` line in the `.lock-owner` record, a
# `generation N` -> `load N` / `file saved <T>` rename in that server's
# identity footer, a no-op `save_graph` on a clean server, and
# `extensions.writable` in its manifest. This viewer embeds the LIBRARY, not
# that server: it never spawns it, never parses its footer, and reads through
# `load_file_with` / `load_kgl_bytes_with`, which take no lease and are
# unchanged across both releases (`command grep` for `save_graph`,
# `lock-owner`, `GraphWriterLease` and `GraphFileIdentity` over the tracked
# tree: zero hits outside gitignored notes, 2026-09-02). The one 0.16.20
# addition that could reach us is `GraphFileIdentity::modified()`; it is the
# primitive for showing how fresh the served file is, which this viewer does
# not show at all — the parked "viewer follows the served file" item, not an
# adoption for this move. The `fastembed` 5 -> 6 move is invisible here:
# nothing in this workspace enables that optional kglite feature.
#
# Re-checked 2026-09-03: `0.16.22` is published and current (registry API, 101
# versions, crate not yanked), and the floor goes there from `=0.16.20` in one
# step — 0.16.21 was published while this repo was pinned below it, so this
# move carries both releases.
#
# 0.16.21 is binding- and writer-side. Its headline — a fired deadline now
# raising `CypherTimeoutError` instead of `CypherExecutionError` — is a Python
# remap; on the Rust side `KgError::CypherTimeout` merely gains a `message`
# field, and the note in the CHANGELOG applies to callers that construct or
# destructure the variant. This crate does neither: every `KgError` goes whole
# into `CoreError::Query(Box<_>)` and reaches a user through `Display`, so a
# timeout still arrives as the same 422 and needs no code here. Its *wording*
# does move, and for the better: the old `CypherExecution` wrapper printed
# "Cypher execution error: Query timed out. Hints: …", where the typed variant
# prints the hint first and appends "(elapsed Nms, limit Mms)" — the numbers
# that say whether the ceiling is the problem. `docs/viewer/queries.md` and
# `panels.ts` quote the message by its leading words, which is exactly the
# half that did not move. The
# `save_graph` write opt-in and `ServerExtensions::read_only` land on kglite's
# own MCP server, which this project neither embeds nor spawns; `from_records`
# key strictness lands on a loader it does not call. The one thing that does
# reach us is `kglite::api::introspection::TypeCapabilities` +
# `compute_type_capabilities_for` going public — the export that
# `meta_graph::capabilities_for` has been waiting for since P8, and this move
# deletes that mirror.
#
# 0.16.22 is blueprint- and ontology-side. Its two Rust breaks —
# the spec structs gaining fields so an exhaustive struct literal no longer
# compiles, and `JunctionEdge::target` becoming `Vec<String>` — cannot reach a
# consumer that constructs no blueprint: `Blueprint`, `NodeSpec`, `FkEdge`,
# `JunctionEdge` and `from_records` are zero hits across the tracked tree.
# `ontology_audit()` and `edge_property_violation()` gain a column each; this
# viewer calls neither, and pins no column set of its own. The behavioural
# change with the widest blast radius is ranked retrieval: `text_bm25` and
# `vector_score` on a property with **no index** now raise instead of
# answering zero rows. That is a change this project wants and does not have
# to handle specially — it issues no ranked query itself (`text_bm25`,
# `text_score`, `vector_score`: zero hits), and a user-typed one arrives at
# `CoreError::Query` like any other engine refusal, where a named error is
# strictly better than the silent empty table the viewer used to draw. The
# release also moves the `.kgl` golden digest; nothing here pins one. `make
# fixture` proves byte-stability by regenerating twice **within one run**, and
# the committed fixtures are loaded by tests, never hashed against a constant
# — kglite reads older `.kgl` versions, so a fixture written by 0.16.14 still
# loads under 0.16.22 and its render baseline is unmoved.
#
# NO `path` component, and its removal (P6) fixed a shipped defect rather than
# tidying a preference. The sibling checkout sits OUTSIDE this workspace, and
# maturin vendors an out-of-workspace path dependency into the source
# distribution: the pre-P6 `maturin sdist` was 2.5 MB carrying 391 files of
# KGLite's source under this project's name, resolving against the vendored
# copy instead of the registry — the same failure KGLite's own build_wheels.yml
# records for sonagram. A path dep also cannot exist in CI or in any consumer's
# unpack directory, where `../../../KGLite` is simply absent.
#
# To develop against an unreleased kglite, patch it in locally and do not
# commit the result: an untracked `.cargo/config.toml` holding
# `[patch.crates-io] kglite = { path = "../../KGLite/crates/kglite" }` (paths
# there are relative to the config file, not to this manifest). That rewrites
# Cargo.lock's kglite entry to a sourceless path entry, so the committed
# lockfile must be restored before committing — which is exactly why the patch
# is opt-in and out of tree.
kglite = "=0.16.22"

# The rasteriser behind `RenderFormat::Png` (D13). Pure Rust, MIT/Apache-2.0,
# MSRV 1.85 — below this workspace's 1.88. `tiny-skia` is NOT a second manifest
# entry: resvg re-exports the exact copy it renders through, and two independent
# requirements on one rasteriser is a place `cargo update` can leave two of it.
#
# Default features minus the two this emitter cannot use: `svgz` (nothing here
# gzips its own output) and `raster-images` (the SVG is self-contained by rule —
# no `<image href>`, so no GIF/JPEG/WebP decoders need shipping). `text` and
# `system-fonts` stay, and they are the whole point: without them `<text>` is
# dropped silently. Measured cost, release binary on 2026-08-29:
# 11 739 152 -> 14 105 184 bytes (+2.26 MiB), same tree, same profile,
# with the PNG path the only difference.
resvg = { version = "0.48.1", default-features = false, features = ["text", "system-fonts", "memmap-fonts"] }

# Inflates the three vendored coastline outlines (G4b). The finest is 3.1 MB of
# JSON and 774 KB of gzip, and it is embedded in every binary and every wheel
# whether a map is drawn or not, so it ships compressed.
#
# NOT a new crate in the tree: kglite already depends on flate2 for `.kgl`
# compression, so this is a direct requirement on something Cargo.lock already
# resolves — no new licence, no new build time, and no second copy (the version
# requirement is deliberately loose so it unifies with the engine's rather than
# pinning a second one beside it).
flate2 = "1"

serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
ts-rs = { workspace = true }

[dev-dependencies]
tempfile = "3.27.0"
# The PNG smoke test decodes what resvg encoded, with a decoder that is not
# resvg's: an encoder checked only by its own decoder can agree with itself
# about a file nothing else opens.
png = "0.18.1"
